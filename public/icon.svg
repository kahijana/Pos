<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Content Group centered in Safe Zone (80% box: 51 to 460) -->
  <g transform="translate(256, 256)">
    <!-- Back Unit (Satuan 2: Big Box / Pack) -->
    <rect x="-140" y="-140" width="180" height="180" rx="32" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
    
    <!-- Barcode lines inside Back Unit -->
    <g fill="#38bdf8" opacity="0.8">
      <rect x="-115" y="-110" width="12" height="60" rx="4"/>
      <rect x="-93" y="-110" width="8" height="60" rx="3"/>
      <rect x="-75" y="-110" width="18" height="60" rx="4"/>
      <rect x="-47" y="-110" width="8" height="60" rx="3"/>
      <rect x="-29" y="-110" width="14" height="60" rx="4"/>
      <rect x="-5" y="-110" width="10" height="60" rx="4"/>
    </g>
    <text x="-50" y="-20" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="1">UNIT 2</text>

    <!-- Front Unit (Satuan 1: Individual Retail Item) with drop shadow -->
    <g filter="drop-shadow(0 16px 24px rgba(0,0,0,0.45))">
      <rect x="-40" y="-40" width="180" height="180" rx="36" fill="url(#emeraldGrad)"/>
      <rect x="-40" y="-40" width="180" height="180" rx="36" fill="none" stroke="#6ee7b7" stroke-width="6" opacity="0.6"/>
      
      <!-- Shopping Cart & 2S Emblem -->
      <path d="M-6 24 C-6 10, 8 -4, 26 -4 C44 -4, 58 10, 58 24" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <rect x="-16" y="24" width="132" height="74" rx="18" fill="#ffffff"/>
      
      <!-- "2S" Brand Text in Cart -->
      <text x="50" y="73" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#065f46" text-anchor="middle" letter-spacing="-1">2S</text>
    </g>

    <!-- Red Laser / Barcode Scan Line Across -->
    <line x1="-160" y1="-8" x2="160" y2="-8" stroke="#ef4444" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
    <!-- Laser glow -->
    <line x1="-160" y1="-8" x2="160" y2="-8" stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
